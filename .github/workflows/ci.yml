name: CI

on:
  push:
    branches: [main, poc, "poc/**", "build/**"]
  pull_request:
    branches: [main, poc]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP lint + unit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer lint
      - run: composer test:unit

  js:
    name: JS lint + unit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  integration:
    name: wp-env integration (WP 7.1.1 / PHP 8.3)
    runs-on: ubuntu-latest
    needs: [php, js]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
      - name: Container logs on failure
        if: failure()
        run: npx wp-env logs tests || true

  e2e:
    name: Playwright + axe
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v7
      - id: present
        name: Skip until the e2e suite exists (Phase 8)
        run: |
          if [ -f tests/e2e/playwright.config.mjs ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.present.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.present.outputs.run == 'true'
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - if: steps.present.outputs.run == 'true'
        run: npm run env:start && npm run env:seed && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always() && steps.present.outputs.run == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: npm ci
      - run: composer audit
      - run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Forbidden patterns (SPEC §3)
        run: bash scripts/forbidden-patterns.sh

  # CodeQL (JavaScript) is intentionally absent: code scanning needs GitHub Advanced Security on a
  # private repo. Re-add `github/codeql-action` init/analyze steps once it is enabled or the repo is public.
